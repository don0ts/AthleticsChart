<!doctype html>
<html lang="en" data-ath-public="1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Athletics — Sign in</title>
<link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="badge">A's</div>
        <div>
          <h1>Athletics Charting</h1>
          <p class="sub">Sign in to continue</p>
        </div>
      </div>

      <label class="field">
        <span>User</span>
        <input type="text" id="user" autocomplete="username" placeholder="User" />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" id="pass" autocomplete="current-password" placeholder="Password" />
      </label>

      <div class="err" id="err"></div>

      <button class="btn primary" id="signin">Sign in</button>
      <div class="status" id="status">Connecting…</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
